
version: '3.8'

services:
  # Le service de base de données
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    env_file: .env
    restart: always
    networks:
      - inception_network
    volumes:
      - mariadb_vol:/var/lib/mysql

  # Le service d'exécution PHP
  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    env_file: .env
    restart: always
    networks:
      - inception_network
    volumes:
      - wordpress_vol:/var/www/html
    depends_on:
      - mariadb

  # 3. Le serveur Web (Point d'entrée)
  nginx:
    build: requirements/nginx
    container_name: nginx
    env_file: .env
    restart: always
    ports:
      - "443:443"
    networks:
      - inception_network
    volumes:
      - wordpress_vol:/var/www/html
    depends_on:
      - wordpress

# Déclaration du réseau interne imposé par le sujet
networks:
  inception_network:
    driver: bridge

# Déclaration des volumes nommés avec chemins absolus imposés par le sujet
volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/login/data/mariadb
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sm-gaidi/data/wordpress